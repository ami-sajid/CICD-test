name: CICD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest    
    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      #- name: Install packages
      #  run: npm install

      #- name: run the test
      #  run: npm run test

      - name: install Python
        run: sudo apt install python3 python3-pip -y

      - name: Start website in port 8000
        run: |
          python3 -m http.server 8000 &
          sleep 2

      - name: Test website
        run: curl --fail http://localhost:8000

      

  
  Deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: SSh commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ vars.PORT }}
          script: |
            cd /home/ubuntu/CICD-test
            git pull
            pm2 restart all
            sudo systemctl restart nginx
            pwd


        
